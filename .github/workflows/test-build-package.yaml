# Tests the `build-package` composite action against the fixture package in
# test/fixtures/pkg. Safe to run on every push/PR: it only builds and
# smoke-tests a throwaway package, no publishing or signing involved.

name: Test build-package action
on:
  push:
    branches: [ main ]
    paths:
      - "build-package/**"
      - "test/fixtures/pkg/**"
      - ".github/workflows/test-build-package.yaml"
  pull_request:
    paths:
      - "build-package/**"
      - "test/fixtures/pkg/**"
      - ".github/workflows/test-build-package.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [ ubuntu-latest, macos-latest, windows-latest ]
    timeout-minutes: 5
    outputs:
      package-name: ${{ steps.build.outputs.package-name }}
      package-version: ${{ steps.build.outputs.package-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # The build-package action assumes the package it builds lives at the
      # repo root (pyproject.toml, Makefile, tasks.py), so stage the fixture
      # there for the duration of this job.
      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        id: build
        uses: ./build-package

      - name: Assert extracted metadata matches the fixture
        env:
          PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package-version }}
        run: |
          test "${PACKAGE_NAME}" = "pypi-release-action-fixture" || {
            echo "::error::unexpected package-name output: ${PACKAGE_NAME}"; exit 1;
          }
          test "${PACKAGE_VERSION}" = "0.0.1a1" || {
            echo "::error::unexpected package-version output: ${PACKAGE_VERSION}"; exit 1;
          }

      - name: Assert dist/ was built
        run: |
          ls dist/*.whl dist/*.tar.gz dist/SHA256SUMS

  verify-artifact:
    needs: build
    runs-on: [ ubuntu-latest, macos-latest, windows-latest ]
    timeout-minutes: 5
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Assert dist artifact contains the expected files
        run: |
          ls dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          cd dist && sha256sum --check SHA256SUMS
