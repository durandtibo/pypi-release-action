# Tests the `sign` composite action end-to-end: it creates a throwaway
# GitHub release/tag, signs a fixture package's distributions with Sigstore,
# and attaches them to that release, then deletes the release/tag again.
# Also tests its checksum-verification failure path (reject-tampered-checksums).
#
# Manual trigger only: unlike ci-build-package, this creates real (if
# short-lived) GitHub releases/tags, so it's not run on every push/PR.

name: Sign
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only the build-package action needs OS coverage (see
    # ci-build-package.yaml); signing/publishing aren't OS-dependent, so a
    # single build here just produces the one "dist" artifact sign consumes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        uses: ./build-package

  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore OIDC keyless signing
      contents: write # create/delete the throwaway release and attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Create throwaway release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-sign-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Test run $tag (throwaway, will be deleted)" \
            --notes "Created by the ci-sign workflow, safe to ignore/delete." \
            --target "${{ github.sha }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run sign action
        uses: ./sign
        with:
          tag-name: ${{ steps.release.outputs.tag }}

      - name: Assert signature bundles were produced
        run: |
          ls dist/*.sigstore.json

      - name: Assert signatures were attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' | grep -q '\.sigstore\.json$'

      - name: Delete throwaway release and tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag || true

  reject-tampered-checksums:
    # sign must fail closed if the downloaded "dist" artifact doesn't match
    # the checksums recorded at build time, before signing anything or
    # touching a release. Doesn't need id-token/contents permissions since
    # it never reaches those steps.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Run build-package action
        uses: ./build-package
        with:
          artifact-name: dist-tampered-source

      - name: Tamper with a built distribution
        run: echo "corrupted" >> dist/*.tar.gz

      - name: Re-upload dist artifact under the name sign expects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Run sign action
        id: sign
        continue-on-error: true
        uses: ./sign
        with:
          tag-name: ci-sign-checksum-test-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assert sign action failed
        run: |
          test "${{ steps.sign.outcome }}" = "failure" || {
            echo "::error::expected sign to fail on tampered checksums, got outcome=${{ steps.sign.outcome }}"; exit 1;
          }
