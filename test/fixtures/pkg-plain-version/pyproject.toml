[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypi-release-action-fixture"
version = "9.9.9"
description = "Throwaway fixture package with a plain release version, used to test that build-package rejects manual runs targeting a non-dev/pre-release version."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["pypi_release_action_fixture"]
