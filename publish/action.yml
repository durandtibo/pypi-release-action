name: Publish PyPI package
description: >
  Downloads the "dist" (and, on tag pushes, "signatures") artifacts,
  verifies checksums and Sigstore signatures, and publishes the package to
  PyPI via Trusted Publishing (OIDC). Requires `id-token: write` permission
  on the calling job, and a workflow-file path matching what is registered
  as the PyPI Trusted Publisher.

inputs:
  workflow-filename:
    description: >
      Filename (not path) of the calling workflow, e.g. "release-pypi.yaml".
      Must match the workflow filename registered with PyPI's Trusted
      Publisher for this project, since it is used to verify the Sigstore
      certificate identity on tag pushes.
    required: true
  repository-url:
    description: >
      Target package index URL, passed through to pypa/gh-action-pypi-publish.
      Leave unset to publish to PyPI. Set to
      "https://test.pypi.org/legacy/" to publish to TestPyPI instead, e.g.
      when testing this action.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
      with:
        name: dist
        path: dist/

    - name: Verify checksums
      shell: bash
      run: |
        cd dist && sha256sum --check SHA256SUMS && rm SHA256SUMS

    - name: Download signature bundles
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
      with:
        name: signatures
        path: dist/

    - name: Verify Sigstore signatures
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        uvx sigstore verify identity dist/*.tar.gz dist/*.whl \
          --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/${{ inputs.workflow-filename }}@${{ github.ref }}" \
          --cert-oidc-issuer https://token.actions.githubusercontent.com

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # ratchet:pypa/gh-action-pypi-publish@v1.14.2
      with:
        repository-url: ${{ inputs.repository-url || 'https://upload.pypi.org/legacy/' }}
